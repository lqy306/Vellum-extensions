[Extension]
id=io.github.vellum.project-sidebar
icon=folder-symbolic

[zh_CN]
title=项目侧边栏
description=浏览你明确选择的项目目录，快速打开同一项目中的文件。
lesson=扩展只枚举你选择的目录，不会自动扫描磁盘。

[en]
title=Project Sidebar
description=Browses a project directory you explicitly select and opens nearby files quickly.
lesson=The extension enumerates only directories you select; it never scans your disk automatically.
