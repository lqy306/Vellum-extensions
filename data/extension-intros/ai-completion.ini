[Extension]
id=io.github.vellum.ai-completion
icon=utilities-terminal-symbolic

[zh_CN]
title=AI 代码助手
description=提供内联补全、手动代码总结和按修改行数自动更新的摘要上下文。
lesson=适合希望在可信 OpenAI 兼容服务中获得实时辅助的开发者；请先在扩展设置中填入服务地址、模型和密钥。

[en]
title=AI Code Assistant
description=Provides inline completion, manual code summaries and summary context that updates after a chosen number of modified lines.
lesson=Best for developers using a trusted OpenAI-compatible service; configure its endpoint, model and key in extension settings first.
